[project]
name = "cv25yolo"
version = "0.1.0"
description = "A toy converter from YOLOv5 ONNX files to network binaries for the Ambarella CV25 accelerator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy", "onnx", "onnxruntime", "pillow"]

[project.optional-dependencies]
dev = ["pytest", "pytest-xdist", "ruff"]

[project.scripts]
cv25yolo = "cv25yolo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cv25yolo"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "D", "ANN"]
ignore = ["D203", "D213", "B905"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]
