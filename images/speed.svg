<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440" role="img" aria-labelledby="title desc">
<title id="title">Time per frame on the camera</title>
<desc id="desc">Mean time per frame of YOLOv5n and YOLOv5s at each input size, against the number of input pixels. YOLOv5n: 26 ms at 320 x 256 to 150 ms at 960 x 544. YOLOv5s: 69 ms to 464 ms.</desc>
<style>
  svg { --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781; --grid: #e1e0d9;
        --axis: #c3c2b7; --n: #2a78d6; --s: #eb6834; }
  @media (prefers-color-scheme: dark) {
    svg { --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781; --grid: #2c2c2a;
          --axis: #383835; --n: #3987e5; --s: #d95926; }
  }
  text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .title { font-size: 16px; font-weight: 600; fill: var(--ink); }
  .sub { font-size: 12px; fill: var(--ink-2); }
  .tick { font-size: 11px; fill: var(--muted); }
  .label { font-size: 12px; fill: var(--ink-2); }
  .series { font-size: 12px; font-weight: 600; fill: var(--ink); }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
</style>
<rect width="720" height="440" rx="8" fill="var(--surface)"/>
<text class="title" x="24" y="28">Time per frame on the camera</text>
<text class="sub" x="24" y="46">Mean of larod-client runs on an AXIS M4216-V, by number of input pixels. Both orientations of a size are shown.</text>
